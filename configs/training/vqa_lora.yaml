model:
  name: "MBZUAI/GeoChat-7B"
  revision: "main"

training:
  epochs: 3
  learning_rate: 2e-4
  batch_size: 4
  gradient_accumulation_steps: 4

lora:
  enabled: true
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

dataset:
  name: "bigearthnet_vqa"
  subset: "development"
